<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>SG 한팀장 | 로그인</title>
<style>
:root{
  --sg-green:#2ea44f; --sg-green-dark:#1f7a3a; --sg-green-light:#e8f7ec;
  --border:#e2e5e2; --bg:#f7f8f7; --card-bg:#fff; --text:#1a1a1a; --text-muted:#6b6b6b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171a; --card-bg:#1d2226; --text:#eef1ee; --text-muted:#a3aba5;
         --border:#2a3128; --sg-green-light:#173322; }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(160deg,var(--sg-green-light) 0%,var(--bg) 60%);
  color:var(--text); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.card{
  width:100%; max-width:380px; background:var(--card-bg);
  border:1px solid var(--border); border-radius:20px;
  padding:34px 26px; text-align:center; box-shadow:0 10px 40px rgba(20,40,25,.12);
}
.card.shake{animation:sh .4s;}
@keyframes sh{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
@media (prefers-reduced-motion: reduce){ .card.shake{animation:none;} }
.mark{font-size:40px;font-weight:900;color:var(--sg-green-dark);line-height:1;letter-spacing:-.03em;}
.title{font-size:15px;font-weight:800;margin-top:10px;}
.sub{font-size:12px;color:var(--text-muted);margin-top:6px;}
form{display:flex;flex-direction:column;gap:10px;margin-top:26px;}
input{
  width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;
}
input:focus{outline:none;border-color:var(--sg-green);}
button{
  padding:13px;border:none;border-radius:12px;background:var(--sg-green);color:#fff;
  font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;
}
button:disabled{opacity:.6;cursor:default;}
.err{color:#c0392b;font-size:12.5px;font-weight:600;margin-top:12px;min-height:18px;}
.note{font-size:11.5px;color:var(--text-muted);margin-top:16px;line-height:1.6;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="mark">SG 한팀장</div>
  <div class="title">병해충 진단 · 학습앱</div>
  <div class="sub">SG 한국삼공 임직원 전용</div>
  <form id="f" autocomplete="off">
    <input id="empNo" type="text" placeholder="사번" autocomplete="username" required>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button type="submit" id="btn">로그인</button>
  </form>
  <div class="err" id="err"></div>
  <div class="note">계정은 관리자가 발급합니다.<br>문의: 경영지원팀</div>
</div>
<script>
var f = document.getElementById('f'), err = document.getElementById('err'),
    btn = document.getElementById('btn'), card = document.getElementById('card');
f.addEventListener('submit', function(ev){
  ev.preventDefault();
  err.textContent = ''; btn.disabled = true; btn.textContent = '확인 중…';
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      empNo: document.getElementById('empNo').value,
      password: document.getElementById('pw').value
    })
  })
  .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
  .then(function(res){
    if (res.ok) { location.href = '/'; return; }
    err.textContent = res.d.error || '로그인에 실패했습니다';
    document.getElementById('pw').value = '';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  })
  .catch(function(){ err.textContent = '서버에 연결할 수 없습니다'; })
  .then(function(){ btn.disabled = false; btn.textContent = '로그인'; });
});
document.getElementById('empNo').focus();
</script>
</body>
</html>
